name: Sync upstream

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# Pushes use an app installation token; the built-in token only handles the
# inactivity-timer reset.
permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables cron workflows in public repos after 60 days without
      # repository activity, and this repo is only active when upstream
      # releases. Re-enabling an enabled workflow resets that timer.
      - name: Reset the scheduled-workflow inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT 'repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable'

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.FORK_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORK_SYNC_APP_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: peerdb
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The target tag is the upstream base's major.minor plus the number
      # of extra commits in the fork. A release is due whenever that tag
      # doesn't exist yet — a new upstream release, freshly merged fork PRs,
      # or both. The upstream tag goes to FETCH_HEAD, never a local tag ref
      # (the fork's own tag names live in the same vX.Y.Z namespace).
      - name: Determine release
        id: rel
        run: |
          git remote add upstream https://github.com/golang/crypto
          latest=$(git ls-remote --tags upstream 'v*' | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          git fetch --no-tags upstream "refs/tags/$latest"
          new_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          base_commit=$(git merge-base HEAD "$new_commit")
          n=$(git rev-list --count "$base_commit..HEAD")
          target="${latest%.*}.$n"
          if git ls-remote --exit-code origin "refs/tags/$target" >/dev/null; then
            echo "Up to date: $target already released"
            echo "target=" >> "$GITHUB_OUTPUT"
          else
            echo "Release due: $target (upstream $latest + $n fork commits)"
            echo "target=$target" >> "$GITHUB_OUTPUT"
          fi
          echo "new_commit=$new_commit" >> "$GITHUB_OUTPUT"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"

      - name: Rebase fork commits onto new upstream base
        if: steps.rel.outputs.target != '' && steps.rel.outputs.base_commit != steps.rel.outputs.new_commit
        run: |
          git config user.name 'peerdb-fork-sync[bot]'
          git config user.email 'peerdb-fork-sync[bot]@users.noreply.github.com'
          echo "Rebasing onto ${{ steps.rel.outputs.new_commit }}"
          git rebase --onto '${{ steps.rel.outputs.new_commit }}' '${{ steps.rel.outputs.base_commit }}' peerdb

      - name: Determine PeerDB Go version
        id: go
        run: |
          version=$(curl -fsSL https://raw.githubusercontent.com/PeerDB-io/peerdb/main/flow/go.mod | awk '/^go /{print $2}')
          echo "PeerDB uses go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: false

      # Only the root ssh package: ssh/test and ssh/agent replay recorded
      # transcripts that hardcode upstream's 2 MiB window, so the patch
      # invalidates them by design. The root package runs full in-memory
      # handshakes against the patched code.
      - name: Validate
        run: |
          go build ./...
          go test ./ssh/

      # master mirrors the upstream base of the current release, so
      # master...peerdb always shows the full fork delta.
      - name: Push branch, tag, and upstream-base master
        if: steps.rel.outputs.target != ''
        run: |
          git push --force origin peerdb
          git tag '${{ steps.rel.outputs.target }}' peerdb
          git push origin 'refs/tags/${{ steps.rel.outputs.target }}'
          git push origin '${{ steps.rel.outputs.new_commit }}':refs/heads/master

      # A fully green run pings the heartbeat monitor; when pings stop —
      # a failing run or a schedule that stopped firing — the team is
      # alerted. Inline curl: this workflow uses GitHub-official actions
      # only.
      - name: Heartbeat
        env:
          SYNC_HEARTBEAT_URL: ${{ secrets.SYNC_HEARTBEAT_URL }}
          SYNC_HEARTBEAT_TOKEN: ${{ secrets.SYNC_HEARTBEAT_TOKEN }}
        run: |
          curl -fsS -m 10 --retry 3 -H "Authorization: Bearer $SYNC_HEARTBEAT_TOKEN" "$SYNC_HEARTBEAT_URL"
