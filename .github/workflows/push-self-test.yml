name: Sync push self-test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.FORK_SYNC_APP_ID }}
          private-key: ${{ secrets.FORK_SYNC_APP_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: peerdb
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Exercise the sync push paths
        run: |
          git config user.name 'peerdb-fork-sync[bot]'
          git config user.email 'peerdb-fork-sync[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          git commit --allow-empty -m 'sync push self-test; reverted by the same run'
          git push origin peerdb
          echo 'branch push: OK'
          git reset --hard "$before"
          git push --force origin peerdb
          echo 'force-push: OK'
          git tag sync-push-self-test
          git push origin refs/tags/sync-push-self-test
          git push origin :refs/tags/sync-push-self-test
          echo 'tag push and delete: OK'
